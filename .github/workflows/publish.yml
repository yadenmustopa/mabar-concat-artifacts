name: Publish existing Concat artifacts

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Completed native build workflow run ID to publish
        required: true
        type: string

permissions:
  actions: read
  contents: write

jobs:
  publish:
    name: Normalize and publish runtime ZIPs
    runs-on: ubuntu-24.04
    steps:
      - name: Download native build artifacts
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          pattern: Concat-*
          path: bundles
          merge-multiple: true

      - name: Install archive tools
        run: sudo apt-get update && sudo apt-get install -y p7zip-full unzip zip

      - name: Normalize runtime layouts
        shell: bash
        run: |
          set -euo pipefail

          normalize_linux() {
            local source_arch="$1"
            local output_name="$2"
            local deb
            local stage
            deb="$(find bundles -type f -name "Concat-*-linux-${source_arch}.deb" -print -quit)"
            test -n "$deb"
            rm -rf "deb-${source_arch}"
            dpkg-deb -x "$deb" "deb-${source_arch}"
            stage="deb-${source_arch}/opt/concat"
            test -f "$stage/concat" && test -d "$stage/lib"
            mkdir -p "work/${output_name%.*}"
            cp "$stage/concat" "work/${output_name%.*}/concat"
            cp -a "$stage/lib" "work/${output_name%.*}/lib"
            (cd "work/${output_name%.*}" && zip -r "../../$output_name" .)
          }

          normalize_windows() {
            local stage
            stage="$(find bundles -type f -name concat.exe -print -quit | xargs -r dirname)"
            test -n "$stage" && test -f "$stage/concat.exe"
            mkdir -p work/win64
            cp -a "$stage/." work/win64/
            (cd work/win64 && zip -r ../../concat-win64.zip .)
          }

          normalize_macos() {
            local source_arch="$1"
            local output_name="$2"
            local dmg
            local app
            dmg="$(find bundles -type f -name "Concat-*-macos-${source_arch}.dmg" -print -quit)"
            test -n "$dmg"
            rm -rf "dmg-${source_arch}"
            7z x -y "$dmg" "-odmg-${source_arch}" >/dev/null
            app="$(find "dmg-${source_arch}" -type d -name 'Concat.app' -print -quit)"
            test -n "$app" && test -f "$app/Contents/MacOS/concat"
            mkdir -p "work/${output_name%.*}/lib"
            cp "$app/Contents/MacOS/concat" "work/${output_name%.*}/concat"
            if [ -d "$app/Contents/Frameworks" ]; then
              cp -a "$app/Contents/Frameworks/." "work/${output_name%.*}/lib/"
            fi
            (cd "work/${output_name%.*}" && zip -r "../../$output_name" .)
          }

          normalize_linux x86_64 concat-linux64.zip
          normalize_linux aarch64 concat-linux-arm64.zip
          normalize_windows
          normalize_macos arm64 concat-mac-arm64.zip
          normalize_macos x86_64 concat-mac.zip

          unzip -t concat-win64.zip >/dev/null
          unzip -l concat-win64.zip | grep -E '(^|/)concat\.exe$' >/dev/null
          for archive in concat-linux64.zip concat-linux-arm64.zip concat-mac-arm64.zip concat-mac.zip; do
            unzip -t "$archive" >/dev/null
            unzip -l "$archive" | grep -E '(^|/)concat($|/)' >/dev/null
            unzip -l "$archive" | grep -E '(^|/)lib/' >/dev/null
          done
          sha256sum concat-*.zip > SHA256SUMS
          ls -lh concat-*.zip SHA256SUMS

      - name: Upload runtime assets to the public release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload v0.1.0 concat-linux64.zip concat-linux-arm64.zip concat-win64.zip concat-mac-arm64.zip concat-mac.zip SHA256SUMS --repo "$GITHUB_REPOSITORY" --clobber
